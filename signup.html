<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Eoto Properties</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="auth-page">

    <div class="auth-box">
        <div class="auth-header">
            <div class="logo">
                EOTO <span>PROPERTIES</span>
            </div>
            <h1>Create Account</h1>
            <p class="auth-subtitle">Join Eoto Properties Management</p>
        </div>

        <form id="signupForm" class="auth-form">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>
                <span class="error-message" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="signupEmail">Email Address</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required>
                <span class="error-message" id="signupEmailError"></span>
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required>
                    <button type="button" class="toggle-password" id="toggleSignupPassword">
                        👁️
                    </button>
                </div>
                <span class="error-message" id="passwordError"></span>
                <small class="password-hint">At least 8 characters</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>
                    <button type="button" class="toggle-password" id="toggleConfirmPassword">
                        👁️
                    </button>
                </div>
                <span class="error-message" id="confirmError"></span>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" id="agreeTerms" required>
                    <span>I agree to the <a href="#" class="auth-link">Terms & Conditions</a></span>
                </label>
            </div>

            <button type="submit" class="button button-full">
                Create Account
            </button>

            <span class="error-message" id="signupMessage"></span>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html" class="auth-link">Login</a></p>
            <p style="margin-top: 6px; font-size: 0.85rem;"><a href="signout.html" class="auth-link" style="color: var(--muted);">🚪 Active session? Sign Out here</a></p>
            <a href="home.html" class="back-home">← Back to Public Portal</a>
        </div>
    </div>

    <script src="css/js/script.js"></script>

</body>

</html>
